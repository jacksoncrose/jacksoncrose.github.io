<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Montana Hall — Procedural Three.js</title>
<style>
  :root { --panel: rgba(18,20,26,0.82); --line: rgba(255,255,255,0.10); --txt:#e9edf3; --dim:#96a0b0; --acc:#e8b34a; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#0d0f13; color:var(--txt);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  .ui { position:fixed; z-index:5; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow:0 8px 30px rgba(0,0,0,0.35); }
  /* header */
  #title { top:18px; left:18px; padding:11px 15px; max-width:280px; }
  #title .k { font-size:9.5px; letter-spacing:.16em; color:var(--acc); font-weight:700; text-transform:uppercase; }
  #title .n { font-size:20px; font-weight:700; margin-top:2px; letter-spacing:.01em; }
  #title .s { font-size:10.5px; color:var(--dim); margin-top:3px; }
  @media (max-width:1180px){ #title .s{display:none} }
  @media (max-width:1040px){ #title .k{display:none} }
  /* view bar */
  #bar { top:18px; left:50%; transform:translateX(-50%); display:flex; gap:6px; padding:6px; align-items:center; }
  #bar .seg { display:flex; gap:2px; }
  button.pill { background:transparent; color:var(--dim); border:0; padding:8px 12px; border-radius:8px;
    font-size:11px; font-weight:700; letter-spacing:.1em; cursor:pointer; text-transform:uppercase; transition:.15s; }
  button.pill:hover { color:var(--txt); background:rgba(255,255,255,0.06); }
  button.pill.active { color:#0d0f13; background:var(--acc); }
  .div { width:1px; height:20px; background:var(--line); margin:0 4px; }
  /* geometry panel */
  #geo { top:18px; right:18px; padding:12px 14px; min-width:190px; }
  #geo .h { font-size:10px; letter-spacing:.16em; color:var(--acc); font-weight:700; text-transform:uppercase; margin-bottom:8px; }
  #geo .row { display:flex; justify-content:space-between; align-items:baseline; padding:3px 0; }
  #geo .row .l { font-size:11px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; }
  #geo .row .v { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
  #geo .note { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:10px; color:var(--dim); }
  /* badge */
  #badge { bottom:18px; left:18px; padding:10px 14px; }
  #badge .t { font-size:11px; font-weight:700; letter-spacing:.12em; color:#7fd18b; text-transform:uppercase; }
  #badge .u { font-size:10px; color:var(--dim); margin-top:2px; }
  /* toggles */
  #fx { bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:14px; padding:10px 16px; }
  #fx label { display:flex; gap:7px; align-items:center; font-size:11px; color:var(--dim); letter-spacing:.06em;
    text-transform:uppercase; cursor:pointer; user-select:none; }
  #fx input { accent-color:var(--acc); width:14px; height:14px; cursor:pointer; }
  /* hint */
  #hint { bottom:18px; right:18px; padding:9px 13px; font-size:10px; color:var(--dim); letter-spacing:.1em; text-transform:uppercase; }
  @media (max-width:820px){ #title .n{font-size:18px} #geo{display:none} #fx{gap:9px;padding:8px 10px} button.pill{padding:7px 8px} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui card" id="title">
  <div class="k">Parametric model</div>
  <div class="n">Montana Hall</div>
  <div class="s">Montana State University, Bozeman · dimensions from a Riegl TLS scan</div>
</div>

<div class="ui card" id="bar">
  <div class="seg">
    <button class="pill active" data-view="hero">Hero</button>
    <button class="pill" data-view="front">Front</button>
    <button class="pill" data-view="right">Right</button>
    <button class="pill" data-view="rear">Rear</button>
    <button class="pill" data-view="top">Top</button>
  </div>
  <div class="div"></div>
  <div class="seg">
    <button class="pill active" id="btn-day">Day</button>
    <button class="pill" id="btn-night">Night</button>
  </div>
</div>

<div class="ui card" id="geo">
  <div class="h">Model Geometry</div>
  <div class="row"><span class="l">Triangles</span><span class="v" id="stat-tris">—</span></div>
  <div class="row"><span class="l">Vertices</span><span class="v" id="stat-verts">—</span></div>
  <div class="row"><span class="l">Draw calls</span><span class="v" id="stat-draws">—</span></div>
  <div class="note">Generated in code · procedural textures · no mesh files</div>
</div>

<div class="ui card" id="badge">
  <div class="t">Measured from scan</div>
  <div class="u">Exterior · 1 unit = 1 metre</div>
</div>

<div class="ui card" id="fx">
  <label><input type="checkbox" id="chk-ssao" checked> SSAO</label>
  <label><input type="checkbox" id="chk-bloom" checked> Bloom</label>
  <label><input type="checkbox" id="chk-grade" checked> Color grade</label>
  <label><input type="checkbox" id="chk-shadow" checked> Shadows</label>
  <label><input type="checkbox" id="chk-env" checked> Grounds</label>
  <label><input type="checkbox" id="chk-wire"> Wireframe</label>
</div>

<div class="ui card" id="hint">Drag to orbit · Scroll to zoom</div>
